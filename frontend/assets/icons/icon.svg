<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="#07090e"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#cyberGrad)" stroke-width="6" opacity="0.6"/>
  <!-- Central Emblem: Shield + Trending Graph & Dollar -->
  <g filter="url(#neonGlow)">
    <!-- Trending Up Path -->
    <path d="M 120 360 L 210 270 L 290 320 L 400 180" fill="none" stroke="#00ffcc" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="400,180 340,180 400,240" fill="#00ffcc"/>
    <!-- Currency Node Pulse -->
    <circle cx="210" cy="270" r="14" fill="#00b4d8"/>
    <circle cx="290" cy="320" r="14" fill="#ff007f"/>
    <circle cx="400" cy="180" r="16" fill="#00ffcc"/>
    <!-- Shield / Core Base -->
    <path d="M 256 120 L 330 160 V 230 C 330 280 256 320 256 320 C 256 320 182 280 182 230 V 160 Z" fill="none" stroke="url(#cyberGrad)" stroke-width="12" opacity="0.4"/>
  </g>
</svg>
