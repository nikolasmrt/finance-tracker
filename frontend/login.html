<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FinanceTracker — Entrar</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00f0ff">
    <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
    <link rel="stylesheet" href="./assets/css/variables.css">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="auth-body">
    <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>
    <div class="auth-card">
        <div class="auth-logo">
            <svg class="cyber-logo-icon large" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M18 2L32 10V26L18 34L4 26V10L18 2Z" fill="url(#cyan-purple-grad-auth)" stroke="#00f0ff" stroke-width="2" stroke-linejoin="round"/>
                <path d="M18 10L25 14V22L18 26L11 22V14L18 10Z" fill="#030712" stroke="#bd00ff" stroke-width="1.5"/>
                <circle cx="18" cy="18" r="3" fill="#00f0ff" class="logo-core"/>
                <defs>
                    <linearGradient id="cyan-purple-grad-auth" x1="4" y1="2" x2="32" y2="34" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#00f0ff" stop-opacity="0.2"/>
                        <stop offset="1" stop-color="#bd00ff" stop-opacity="0.3"/>
                    </linearGradient>
                </defs>
            </svg>
            <h1>Finance<span>Tracker</span></h1>
        </div>
        <h2>Aceder ao Sistema</h2>

        <form id="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu.email@exemplo.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <div class="demo-separator">
            <span>OU EXPERIMENTE SEM CADASTRO</span>
        </div>

        <button type="button" id="btn-demo-login" class="btn-demo">
            🧪 Testar Agora (Modo Convidado)
        </button>
        <p class="demo-hint">✨ Acesso 1-Click imediato • Dados realistas pré-carregados</p>

        <p class="auth-redirect">
            Ainda não tem conta? <a href="register.html">Registre-se aqui</a>
        </p>
    </div>

    <script src="./assets/js/auth.js"></script>
</body>
</html>
